name: Deploy Pages

# Code deploys run after a green CI on master; the weekly rollover calls this workflow for the data snapshot.
# Data edits from the site are not deployed: the site reads data/movies.json through the GitHub API.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: ${{ github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      data_ok: ${{ steps.validate.outcome == 'success' }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Deploy exactly the commit CI approved; rollover/dispatch use master.
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || 'master' }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      # Tests already passed in CI for this master commit.
      - name: Build site
        run: |
          npm ci
          npm run build
          npx tsc -p tsconfig.test.json
      - name: Overlay current data and prepare site
        shell: bash
        run: |
          set -euo pipefail
          branch=$(bash scripts/latest-data-branch.sh)
          if [[ -n "$branch" ]]; then
            git fetch --no-tags origin "refs/heads/$branch:refs/remotes/origin/$branch"
            git show "refs/remotes/origin/$branch:data/movies.json" > data/movies.json
            printf 'Deploying master code with data from %s\n' "$branch"
          else
            echo 'No data branch yet; deploying master data.'
          fi
          mkdir -p _site
          cp -R dist/. _site/
          mkdir -p _site/data
          cp data/movies.json _site/data/
      # The site itself writes the data; bad data must not block code deploys, but the run turns red.
      - name: Validate data
        id: validate
        continue-on-error: true
        run: node .test-build/tools/validate-data.js data/movies.json
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
      - name: Post-deploy smoke test
        shell: bash
        run: |
          set -euo pipefail
          base_url="${{ steps.deployment.outputs.page_url }}"
          base_url="${base_url%/}"
          echo "Starting smoke test for $base_url"

          check_ok=false
          for attempt in $(seq 1 6); do
            echo "Smoke test attempt $attempt/6..."
            if page=$(curl -fsSL "$base_url/"); then
              if [[ "$page" == *'<div id="root">'* ]]; then
                js_asset=$(echo "$page" | grep -o 'assets/[^"'\''<> ]*\.js' | head -n 1 || true)
                if [[ -n "$js_asset" ]]; then
                  if curl -fsSL -o /dev/null "$base_url/$js_asset" && \
                     curl -fsSL -o /dev/null "$base_url/sw.js" && \
                     data_json=$(curl -fsSL "$base_url/data/movies.json") && \
                     echo "$data_json" | jq empty; then
                    echo "Smoke test passed on attempt $attempt."
                    check_ok=true
                    break
                  fi
                fi
              fi
            fi
            if [[ $attempt -lt 6 ]]; then
              echo "Smoke test attempt $attempt failed or CDN lagging; sleeping 10s..."
              sleep 10
            fi
          done

          if [[ "$check_ok" != "true" ]]; then
            echo "::error::Smoke test failed after 6 attempts."
            exit 1
          fi
  data-check:
    needs: [build, deploy]
    if: ${{ always() && needs.build.outputs.data_ok == 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Report invalid data
        run: |
          echo "::error::data/movies.json failed validation; the site was deployed anyway. See the Validate data step of the build job."
          exit 1
