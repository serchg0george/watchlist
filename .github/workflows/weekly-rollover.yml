name: Weekly rollover

on:
  schedule:
    - cron: '5 21-23 * * 0'
    - cron: '5 0-3 * * 1'
  workflow_dispatch:
    inputs:
      bootstrap:
        description: Create the first data branch if none exists
        type: boolean
        default: false
      dry_run:
        description: Preview actions without pushing
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: rollover
  cancel-in-progress: false

jobs:
  rollover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      pushed: ${{ steps.rollover.outputs.pushed }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Exercise this revision's tools during manual previews.
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && github.sha || 'master' }}
          persist-credentials: ${{ !inputs.dry_run }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Build data validator
        run: |
          npm ci
          npx tsc -p tsconfig.test.json
      - name: Roll over weekly data
        id: rollover
        env:
          TZ_NAME: Europe/Sofia
          BOOTSTRAP: ${{ inputs.bootstrap && '1' || '0' }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
        run: bash scripts/rollover.sh
  deploy:
    # Even a late-change conflict can occur after the new branch was published.
    if: ${{ always() && needs.rollover.outputs.pushed == 'true' }}
    needs: rollover
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy.yml
